# swagger/components/schemas/student.yaml

type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
properties:
  _id:
    description: "contacts id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "contacts name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "contacts phoneNumber"
    type: number
    example: +380732223165
  isFavourite:
    description: "contacts favourite status"
    type: boolean
    example: true
  contactType:
    description: "contacts type"
    type: string
    enum: ['work', 'home', 'personal']
  photo:
    description: "Link to contacts photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png

